[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-autoapply"
version = "0.1.0"
description = "Local, autonomous Summer 2027 internship discovery, tailoring and application system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "playwright==1.56.0",
  "openai>=1.40",
  "reportlab>=4.2",
  "pypdf>=4.3",
  "keyring>=25",
  "tzdata",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-openpyxl",
  "types-beautifulsoup4",
]

[project.scripts]
autoapply = "autoapply.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoapply = ["dashboard/templates/*", "dashboard/static/*", "dashboard/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
timeout = 180
addopts = "-ra -q --import-mode=importlib"
markers = [
  "browser: launches headless Chromium against local mock ATS servers",
  "acceptance: hermetic end-to-end autonomy criteria (see docs/SPEC.md section 9)",
  "slow: takes more than ~20s",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["autoapply"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "pypdf.*", "keyring.*"]
ignore_missing_imports = true
